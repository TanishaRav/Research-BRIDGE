[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbridge-api"
version = "0.1.0"
description = "Offline-capable matching API for the ResearchBridge synthetic demo"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
